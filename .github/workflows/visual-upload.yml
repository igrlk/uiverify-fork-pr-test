name: Visual upload

# Uploads the capture a fork's pull request saved in "Visual tests" to UI Verify. `workflow_run` always runs this file from
# the default branch, with the repo's secrets, even when the capture came from a fork's pull request.
#
# Never run code from the pull request while holding the key: no checkout of its files, no `npm ci`,
# no `npx` inside its tree (a PR could edit .npmrc or package.json to swap the CLI). The CLI runs at a
# pinned version from an empty directory, and gets only the downloaded archive plus the PR's git
# objects (fetched, never checked out). Every PR-controlled string (branch names) reaches the shell
# through `env`, never `${{ }}` interpolation.
#
# The run's own exit code isn't shown on the PR (a workflow_run job reports on the default branch), so
# changes don't fail it; the UI Verify check the GitHub App posts on the PR's commit is the gate.
#
# GitHub's own env here describes the default branch, so the PR's commit, branch and number are passed
# to the CLI explicitly (COMMIT_SHA, BRANCH, PR_NUMBER).

on:
  workflow_run:
    workflows: [Visual tests]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  upload:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the capture
        uses: actions/download-artifact@v4
        with:
          name: uiverify-archive
          path: ${{ runner.temp }}/archive
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve the commit, branch and PR
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          set -euo pipefail
          pr=""
          if [ "$EVENT" = "pull_request" ]; then
            # workflow_run.pull_requests is empty for fork PRs, so look the PR up by its head.
            pr=$(gh api "repos/$REPO/pulls?state=open&head=$HEAD_OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')
            if [ -z "$pr" ]; then echo "No open PR for $HEAD_OWNER:$HEAD_BRANCH; nothing to upload."; fi
          fi
          # A fork's branch name can match ours (a PR from a fork's "main"), so prefix it with the owner.
          branch="$HEAD_BRANCH"
          if [ "$HEAD_REPO" != "$REPO" ]; then branch="$HEAD_OWNER:$HEAD_BRANCH"; fi
          skip=false
          if [ "$EVENT" = "pull_request" ] && [ -z "$pr" ]; then skip=true; fi
          {
            echo "pr=$pr"
            echo "skip=$skip"
            echo "branch<<__EOF__"
            echo "$branch"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the commit's history (objects only, no checkout)
        if: steps.meta.outputs.skip == 'false'
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git remote add origin "https://github.com/$REPO"
          git fetch -q --filter=blob:none --no-tags origin "$HEAD_SHA"
          git update-ref HEAD "$HEAD_SHA"

      - name: Upload to UI Verify
        if: steps.meta.outputs.skip == 'false'
        env:
          UIVERIFY_API_KEY: ${{ secrets.UIVERIFY_API_KEY }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          PR_NUMBER: ${{ steps.meta.outputs.pr }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          npx -y uiverify@1.7.0 upload \
            --static-dir "$RUNNER_TEMP/archive" \
            --working-directory "$RUNNER_TEMP/repo" \
            --only-changed --exit-zero-on-changes
